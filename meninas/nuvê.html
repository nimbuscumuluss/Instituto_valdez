<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUVÊ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 10px;
            background: #f4f4f4;
        }
        nav ul li {
            display: inline;
        }
        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        .menu {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f4f4f4;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .product img {
            width: 100%;
            border-radius: 10px;
        }
        .image-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .image-row img {
            border-radius: 10px;
        }
        .image-center {
            width: 900px;
            height: 1080px;
        }
        footer {
            background: rgb(152, 152, 152);
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Compras</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="#">Colaboradores</a></li>
                <li><a href="#">Sobre nós</a></li>
            </ul>
        </nav>
    </header>
    
    <img src="img/nuve.png" width="100%">
    
    <section class="menu">
        <div>Frete Grátis </div>
        <div>Promoções </div>
        <div>Segurança </div>
        <div>Patrocínio </div>
    </section>
    
    <section class="products">
        <div class="product">
            <img src="img/banner 2 (2).png">
        </div>
        <div class="product">
            <img src="img/pluie (1).png">
        </div>
    </section>
    
    
        <img src="img/1.png" width="500">
        <img src="img/centro.png" width="500">
        <img src="img/2.png" width="500">
   
    
    <footer>
        <h1>A BELEZA ESTÁ EM VOCÊ</h1>
        <p>Continue comprando em outras partes :)</p>
    </footer>
</body>
</html>
