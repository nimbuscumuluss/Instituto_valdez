<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Lance - Instituto Valdez</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-submit {
            background-color: #ffffff;
            color: #6d3485;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: #6d3485;
            color: #ffffff;
        }

        .form-control {
            background-color: #6d3485;
            color: #ffffff;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Dar Lance</h1>
        <form id="bidForm" class="text-center">
            <div class="mb-3">
                <label for="bidAmount" class="form-label">Digite o valor do lance:</label>
                <input type="number" class="form-control" id="bidAmount" placeholder="R$">
            </div>
            <button type="submit" class="btn btn-submit">Enviar Lance</button>
        </form>
        <p id="result" class="mt-3"></p>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script>
        // Adiciona um evento de escuta para o evento 'submit' do formulário com o ID 'bidForm'
        document.getElementById('bidForm').addEventListener('submit', function (event) {

            // Impede o comportamento padrão do formulário, que é enviar e recarregar a página
            event.preventDefault();

            // Obtém o valor inserido pelo usuário no campo de entrada com o ID 'bidAmount'
            const bidAmount = document.getElementById('bidAmount').value;

            // Verifica se o valor do lance foi preenchido
            if (bidAmount) {
                // Se o lance foi preenchido, exibe uma mensagem de confirmação no elemento com o ID 'result'
                document.getElementById('result').textContent = `Seu lance de R$ ${bidAmount} foi registrado!`;
            } else {
                // Se o lance não foi preenchido, exibe uma mensagem pedindo para o usuário inserir um valor válido
                document.getElementById('result').textContent = 'Por favor, insira um valor válido.';
            }
        });

    </script>
</body>

</html>
