 <center>
<h1>Sua Galeria de Arte</h1>
 </center>

    <!-- Conteúdo Principal -->
    <div class="container mt-5 pt-5">
        <div class="form-upload">
            <h4>Poste sua Arte</h4>
            <form id="artForm">
                <div class="form-group">
                    <label for="artTitle">Título da Arte</label>
                    <input type="text" class="form-control" id="artTitle" placeholder="Digite o título da sua arte">
                </div>
                <div class="form-group">
                    <label for="artImage">Selecione uma Imagem</label>
                    <input type="file" class="form-control-file" id="artImage">
                </div>
                <button type="submit" class="btn btn-upload">Enviar Arte</button>
            </form>
        </div>

        <div class="art-gallery" id="artGallery">
            <!-- Artes postadas aparecerão aqui -->
        </div>
    </div>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script>
        // JavaScript para gerenciar o upload e exibição das artes
      // Adiciona um evento de escuta para o evento 'submit' do formulário com o ID 'artForm'
document.getElementById('artForm').addEventListener('submit', function (event) {
    // Impede o comportamento padrão de envio do formulário, que é recarregar a página
    event.preventDefault();

    // Obtém os valores dos campos de entrada do formulário
    var artTitle = document.getElementById('artTitle').value; // Obtém o título da arte
    var artImage = document.getElementById('artImage').files[0]; // Obtém o arquivo de imagem selecionado

    // Verifica se tanto o título quanto a imagem foram fornecidos
    if (artTitle && artImage) {
        var reader = new FileReader(); // Cria uma nova instância de FileReader para ler o arquivo de imagem
        
        // Define uma função para executar quando o arquivo for lido
        reader.onload = function (e) {
            var artGallery = document.getElementById('artGallery'); // Seleciona o elemento da galeria de arte

            // Cria um novo elemento <div> para exibir a nova arte
            var artItem = document.createElement('div');
            artItem.className = 'art-item'; // Define a classe CSS do novo elemento para estilização
            artItem.innerHTML = `
                <img src="${e.target.result}" alt="${artTitle}"> 
                <h5>${artTitle}</h5>
            `; // Adiciona a imagem e o título da arte no elemento <div>

            // Adiciona o novo elemento de arte à galeria
            artGallery.appendChild(artItem);

            // Limpa o formulário após adicionar a arte
            document.getElementById('artForm').reset();
        };

        // Lê o arquivo de imagem como um URL de dados (data URL)
        reader.readAsDataURL(artImage);
    } else {
        // Exibe um alerta se o título ou a imagem não forem fornecidos
        alert('Por favor, preencha todos os campos!');
    }
});

    </script>
